name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'target/backend/**'
      - 'pom.xml'
  pull_request:
    branches: [ main ]
    paths:
      - 'target/backend/**'
      - 'pom.xml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B clean verify --file target/backend/pom.xml
    - name: Run unit tests
      run: mvn -B test --file target/backend/pom.xml
    - name: Run security scan (OWASP Dependency Check)
      uses: dependency-check/dependency-check-action@main
      with:
        project: 'SAMS Backend'
        path: 'target/backend'
        format: 'HTML'
        failBuild: true
        suppress: true
        autoscan: true